name: Add an avatar emoji
description: Suggest an emoji for the profile picture options
title: "[Emoji]: "
labels: ["emoji"]
body:
  - type: markdown
    attributes:
      value: |
        `avatar.emoji` holds the profile picture options. Each entry must be exactly one emoji.
  - type: input
    id: emoji
    attributes:
      label: Emoji
      description: Exactly one emoji. No letters, digits or multiple emoji.
    validations:
      required: true
  - type: input
    id: suffix
    attributes:
      label: Matching username suffix
      description: If it should pair with a username suffix for the Shuffle button (`suffixEmoji`), e.g. `Fox` (optional).
  - type: textarea
    id: why
    attributes:
      label: Why add it?
      description: Optional.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: It's exactly one emoji.
          required: true
        - label: It's not already in `avatar.emoji`.
          required: true
        - label: It's family-friendly.
          required: true
